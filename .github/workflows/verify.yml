name: Verify SAF

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Run configuration, migration, and synchronization integration checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validation:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            os: windows-latest
            shell: powershell
          - name: PowerShell 7 on Windows
            os: windows-latest
            shell: pwsh
          - name: PowerShell 7 on Linux
            os: ubuntu-latest
            shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - name: Check release hashes
        run: ./scripts/publish-saf.ps1 -Check
      - name: Parse maintained PowerShell scripts
        run: |
          $failures = @()
          foreach ($file in @(Get-ChildItem ./scripts,./tests -Filter *.ps1 -File)) {
            $tokens = $null
            $parseErrors = $null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            $failures += @($parseErrors | ForEach-Object { "$($file.Name): $_" })
          }
          if ($failures.Count) { throw ($failures -join "`n") }
          Write-Host 'PowerShell parsing passed. This does not establish functional behavior.'
      - name: Run explicitly requested integration checks
        if: github.event_name == 'workflow_dispatch' && inputs.integration
        run: ./tests/test-saf.ps1
